# Replace the whole file at .github/workflows/build-sunfish-kernel.yml
# v2: no Google toolchain download; uses Ubuntu's clang-14 + cross gcc.
# UNTESTED. A 4.14 kernel on a newer clang may need more fixes.
name: Build sunfish kernel

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Kernel repo"
        default: "https://github.com/lopro104/android_kernel_google_msm-4.14"
      branch:
        description: "Branch"
        default: "cnb"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Install toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 lz4 cpio git curl xz-utils \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang-14 --version
          # Let clang find lld as plain "ld.lld" (backup for the 32-bit link step)
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld

      - name: Get kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" "${{ inputs.repo }}" kernel
          echo "--- configs found:"
          ls kernel/arch/arm64/configs | grep -i -E "sunfish|floral" || true

      - name: Configure (adds SYSVIPC and BINFMT_MISC)
        working-directory: kernel
        run: |
          set -o pipefail
          DEFCONFIG=$(ls arch/arm64/configs | grep -E '^sunfish.*defconfig$' | head -1)
          echo "Using $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang-14 "$DEFCONFIG"
          # Newer clang cannot do Google's CFI/LTO setup, so turn those off
          scripts/config --file out/.config -d CFI_CLANG -d LTO_CLANG -d SHADOW_CALL_STACK || true
          # 32-bit vDSO fails to link here (x86 ld used for ARM); not needed for testing
          scripts/config --file out/.config -d COMPAT_VDSO || true
          scripts/config --file out/.config -e SYSVIPC -e SYSVIPC_SYSCTL -e BINFMT_MISC
          make O=out ARCH=arm64 CC=clang-14 olddefconfig
          grep -E "CONFIG_SYSVIPC=|CONFIG_BINFMT_MISC=" out/.config
          grep -E "COMPAT_VDSO" out/.config || echo "COMPAT_VDSO not present"

      - name: Build
        working-directory: kernel
        run: |
          # This tree looks for the device-tree compiler at tools/dtc; point it at the one we build
          ln -sf "$PWD/out/scripts/dtc/dtc" tools/dtc
          MAKEARGS=(O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            DTC_EXT="$PWD/out/scripts/dtc/dtc"
            DTC="$PWD/out/scripts/dtc/dtc"
            KCFLAGS=-Wno-error)
          if ! make -j"$(nproc)" "${MAKEARGS[@]}" > build.log 2>&1; then
            echo "=============== LINES WITH ERRORS ==============="
            grep -n -E "error:|undefined|\*\*\*|No rule|not found" build.log | head -40
            echo "=============== WHERE tools/dtc IS SET ==============="
            grep -rn "tools/dtc" Makefile scripts/Makefile.lib arch/arm64/Makefile arch/arm64/boot/dts/Makefile 2>/dev/null | head -20
            ls -l tools/dtc out/scripts/dtc/dtc || true
            echo "=============== RERUN, ONE THREAD ==============="
            make -j1 "${MAKEARGS[@]}" 2>&1 | tail -n 60
            exit 1
          fi
          ls -lh out/arch/arm64/boot/

      - name: Upload kernel image and config
        uses: actions/upload-artifact@v4
        with:
          name: sunfish-kernel
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/**/*.dtb
            kernel/out/.config
